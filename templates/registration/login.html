{% extends "registration/auth_card.html" %}

{% block title %}Log in · ATS{% endblock %}
{% block card_title %}Log in{% endblock %}

{% block card_body %}
<form method="post" action="{% url 'login' %}">
  {% csrf_token %}
  {% include "partials/form_fields.html" %}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit" class="btn btn-primary w-full mt-4">Log in</button>
</form>
<a href="{% url 'password_reset' %}" class="link link-hover text-sm mt-2">Forgot your password?</a>
{% endblock %}
