{% extends "base.html" %}

{% block title %}Rename {{ skill.name }} · ATS{% endblock %}

{% block content %}
<div class="card bg-base-100 shadow max-w-2xl mx-auto">
  <div class="card-body">
    <h1 class="card-title text-2xl">Rename {{ skill.name }}</h1>
    <p class="text-sm opacity-70">The new name shows on every job that uses this skill.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <div class="card-actions justify-end mt-4">
        <a href="{% url 'jobs:skill_list' %}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary">Save name</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
