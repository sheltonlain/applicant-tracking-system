{% extends "base.html" %}

{% block title %}{{ job.title }} board · ATS{% endblock %}

{% block content %}
<div class="mb-2">
  <a href="{{ job.get_absolute_url }}" class="link link-hover text-sm">← Job details</a>
</div>
<div class="flex flex-wrap items-baseline gap-x-3 gap-y-1 mb-4">
  <h1 class="text-2xl font-bold">{{ job.title }}</h1>
  <span class="opacity-70">{{ job.department }} · {{ job.location }}</span>
  {% if job.is_open %}<span class="badge badge-success">Open</span>
  {% else %}<span class="badge badge-neutral">Closed</span>{% endif %}
</div>
{% include "applications/partials/board.html" %}
{% endblock %}
